project:
  type: website
  output-dir: _site

website:
  title: "Data Linkage Practices in R"
  description: "Practical guidance and reproducible R code for record linkage: cleaning, blocking, matching, and evaluating link quality."
  site-url: https://coraliewilliams.github.io/data-linkage-practices/
  repo-url: https://github.com/coraliewilliams/data-linkage-practices
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: theory/index.qmd
        text: Theory
      - href: applications/index.qmd
        text: Applications
      - href: scripts.qmd
        text: Scripts
      - href: checklist.qmd
        text: Checklist
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/coraliewilliams/data-linkage-practices
        aria-label: GitHub repository
  sidebar:
    - id: theory
      title: Theory
      style: floating
      collapse-level: 1
      contents:
        - theory/index.qmd
        - theory/01-why-link.qmd
        - theory/02-identifiers.qmd
        - theory/03-blocking.qmd
        - theory/04-comparison.qmd
        - theory/05-decisions.qmd
        - theory/06-evaluation.qmd
        - theory/07-reporting.qmd
    - id: applications
      title: Applications
      style: floating
      collapse-level: 1
      contents:
        - applications/index.qmd
        - applications/01-hospital-deaths.qmd
        - applications/02-immunisation-disease.qmd
        - applications/03-cohort-admin.qmd
        - applications/04-facility-names.qmd
        - applications/05-country-names.qmd
        - applications/06-deduplication.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    toc-depth: 2
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto
