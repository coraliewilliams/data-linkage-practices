name: Publish Quarto site

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # No R is installed in CI because execute: freeze: auto commits rendered
      # outputs under _freeze/. Run `quarto render` locally before pushing.
      - name: Render website
        run: quarto render

      - name: Initialize gh-pages branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            exit 0
          fi

          current_branch="${GITHUB_REF_NAME:-$(git branch --show-current)}"

          git config user.email "quarto-github-actions-publish@example.com"
          git config user.name "Quarto GHA Workflow Runner"

          git checkout --orphan gh-pages
          git rm -rf .
          touch .nojekyll
          git add .nojekyll
          git commit -m "Initialize gh-pages branch"
          git push origin gh-pages
          git checkout "$current_branch"

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
